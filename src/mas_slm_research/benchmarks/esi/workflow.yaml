version: 1
definition: esi.legacy_v1
metadata:
  workflow_id: esi_mas
  name: ESI MAS
  version: 1.0.0
  description: Constrained multi-agent ESI workflow with parallel ESI1 and vitals
    starts, acuity handoffs through ESI2/ESI345, and doctor finalization.
participating_agents:
  - esi1_agent
  - esi2_agent
  - esi345_agent
  - vitals_agent
  - doctor_agent
sources:
  acuity:
    source_id: acuity
    name: Acuity Branch
    agent_names:
      - esi1_agent
      - esi2_agent
      - esi345_agent
    description: The main ESI acuity decision pathway.
    metadata:
      branch_type: clinical_acuity
  vitals:
    source_id: vitals
    name: Vitals Branch
    agent_names:
      - vitals_agent
    description: The vitals-only parallel support branch.
    metadata:
      branch_type: physiologic_support
start_agents:
  - esi1_agent
  - vitals_agent
finalizing_agents:
  - doctor_agent
allowed_handoffs:
  esi1_agent:
    - esi2_agent
    - doctor_agent
  esi2_agent:
    - esi345_agent
    - doctor_agent
  esi345_agent:
    - doctor_agent
  vitals_agent:
    - doctor_agent
  doctor_agent: []
gates:
  doctor_gate:
    gate_id: doctor_gate
    name: Doctor Gate
    description: Waits until both the acuity branch and vitals branch have handed
      off before doctor finalization.
    required_sources:
      - acuity
      - vitals
    incoming_from: []
    target_node: doctor_agent
    metadata:
      gate_type: readiness_gate
      ready_rule: requires_required_sources_to_handoff_to_target
      terminal_when_not_ready: true
agent_metadata:
  esi1_agent:
    role: acuity
    stage: decision_point_a
    can_handoff: true
    can_finalize: false
  esi2_agent:
    role: acuity
    stage: decision_point_b
    can_handoff: true
    can_finalize: false
  esi345_agent:
    role: acuity
    stage: decision_point_c
    can_handoff: true
    can_finalize: false
  vitals_agent:
    role: vitals
    stage: parallel_support
    can_handoff: true
    can_finalize: false
  doctor_agent:
    role: supervisor
    stage: final_review
    can_handoff: false
    can_finalize: true
workflow_metadata:
  workflow_family: esi_mas
  execution_model: constrained_mas
  parallel_start: true
  doctor_gate_id: doctor_gate
payloads:
  esi1_agent:
    builder: esi.esi1_agent_v1
    input_schema: esi.esi1_agent_input_v1
  esi2_agent:
    builder: esi.esi2_agent_v1
    input_schema: esi.esi2_agent_input_v1
  esi345_agent:
    builder: esi.esi345_agent_v1
    input_schema: esi.esi345_agent_input_v1
  vitals_agent:
    builder: esi.vitals_agent_v1
    input_schema: esi.vitals_agent_input_v1
  doctor_agent:
    builder: esi.doctor_agent_v1
    input_schema: esi.doctor_agent_input_v1
handoff_schemas:
  esi1_agent:
    esi2_agent: esi.esi1_to_esi2_v1
    doctor_agent: esi.esi1_to_doctor_v1
  esi2_agent:
    esi345_agent: esi.esi2_to_esi345_v1
    doctor_agent: esi.esi2_to_doctor_v1
  esi345_agent:
    doctor_agent: esi.esi345_to_doctor_v1
  vitals_agent:
    doctor_agent: esi.vitals_to_doctor_v1
