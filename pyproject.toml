[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-slm-research"
version = "0.0.0"
description = "Configurable single- and multi-agent research experiments"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
mas-slm = "mas_slm_research.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
