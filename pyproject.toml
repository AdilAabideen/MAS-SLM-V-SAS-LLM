[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-slm-research"
version = "0.0.0"
description = "Configurable single- and multi-agent research experiments"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "python-dotenv>=1.0,<2",
  "pydantic>=2.12.5,<3",
  "langchain-core>=1.2.17,<2",
  "langgraph>=1.0.10,<2",
  "langchain-openai>=1.1.10,<2",
  "httpx>=0.27.2,<1",
]

[project.scripts]
mas-slm = "mas_slm_research.cli:main"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mas_slm_research.benchmarks.esi" = ["*.yaml", "*.jsonl", "*.json"]

[tool.setuptools.data-files]
"share/mas-slm-research/examples/esi" = ["examples/esi/*.yaml", "examples/esi/*.jsonl", "examples/esi/*.json"]
"share/mas-slm-research/examples/arithmetic" = ["examples/arithmetic/*.md", "examples/arithmetic/*.py", "examples/arithmetic/*.yaml", "examples/arithmetic/*.jsonl", "examples/arithmetic/*.json"]
"share/mas-slm-research/examples/external_extension" = ["examples/external_extension/*.md", "examples/external_extension/*.py", "examples/external_extension/*.yaml", "examples/external_extension/*.jsonl", "examples/external_extension/*.json"]
