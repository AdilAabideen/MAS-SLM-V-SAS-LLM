name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-toolkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile package and examples
        run: python -m compileall -q src tests examples
      - name: Check fatal lint errors
        run: ruff check src tests examples --select E9,F63,F7,F82
      - name: Run retained research tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Run offline comparison without backend imports
        env:
          PYTHONPATH: src:examples/arithmetic
        run: python -m mas_slm_research.cli compare examples/arithmetic/experiment.yaml --fixture examples/arithmetic/offline_fixture.json --no-artifacts --console none --color never
